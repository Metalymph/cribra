[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cribra"
version = "0.7.1+fuse"
description = "Local Fuse-profile Cribra UniFFI bindings"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[tool.setuptools]
packages = ["cribra_uniffi"]

[tool.setuptools.package-data]
# The builder stages exactly one native library (the host's) in the package
# directory, so listing both names packages exactly one library per wheel.
cribra_uniffi = ["libcribra_uniffi.dylib", "libcribra_uniffi.so"]
