[package]
name = "silens-scan"
version = "0.1.0"
edition = "2024"

[features]
default = []
parallel = ["dep:rayon"]
serde = ["dep:serde"]

[dependencies]
aho-corasick = "1.1.4"
blake3 = "1"
rayon = { version = "1.12.0", optional = true }
regex = "1.13.1"
serde = { version = "1.0", features = ["derive", "rc"], optional = true }

[[bench]]
name = "scan"
harness = false

[dev-dependencies]
criterion = "0.8.2"
serde_json = "1.0"
