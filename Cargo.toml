[package]
name = "cribra"
version = "0.3.0"
edition = "2024"
description = "Embeddable, local-first Rust engine for detecting, reviewing, and safely transforming secrets and sensitive data."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Metalymph/cribra"
documentation = "https://docs.rs/cribra"
keywords = ["secrets", "security", "scanner", "redaction", "privacy"]
categories = ["development-tools", "text-processing"]
rust-version = "1.97"

[features]
default = []
parallel = ["dep:rayon"]
serde = ["dep:serde"]

[dependencies]
aho-corasick = "1.1.4"
blake3 = "1"
rayon = { version = "1.12.0", optional = true }
regex = "1.13.1"
regex-syntax = "0.8.8"
serde = { version = "1.0", features = ["derive", "rc"], optional = true }

[[bench]]
name = "scan"
harness = false

[[bench]]
name = "v02"
harness = false

[[bench]]
name = "isolation"
harness = false

[[bench]]
name = "contextual_tail"
harness = false

[dev-dependencies]
criterion = "0.8.2"
serde_json = "1.0"

[workspace]
members = [
    "crates/cribra-capi",
    "crates/cribra-wasm",
]
resolver = "3"
