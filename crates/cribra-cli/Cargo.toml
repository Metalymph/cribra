[package]
name = "cribra-cli"
version = "0.4.4"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Canonical command-line interface for Cribra"
repository = "https://github.com/Metalymph/cribra"
homepage = "https://github.com/Metalymph/cribra"

[lib]
name = "cribra_cli"
path = "src/lib.rs"

[[bin]]
name = "cribra"
path = "src/main.rs"

[dependencies]
cribra = { version = "^0.7", path = "../.." }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }
