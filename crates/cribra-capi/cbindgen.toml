language = "C"

include_guard = "CRIBRA_H"
pragma_once = false
cpp_compat = true

documentation = true
documentation_style = "doxy"
documentation_length = "full"

style = "both"
usize_is_size_t = true
line_length = 100
tab_width = 4

header = """
/*
 * Cribra native C API.
 *
 * Generated from crates/cribra-capi.
 * Do not edit this file manually.
 *
 * The Cribra native ABI is experimental during the 0.3 series.
 * Crate SemVer and native ABI protocol version are intentionally independent.
 */
"""

autogen_warning = "/* WARNING: generated by cbindgen. Manual changes will be overwritten. */"

[parse]
parse_deps = false
clean = true

[export]
prefix = ""
item_types = ["constants", "structs", "typedefs", "opaque", "functions"]

[fn]
rename_args = "None"
sort_by = "Name"

[struct]
rename_fields = "None"

[const]
sort_by = "Name"
