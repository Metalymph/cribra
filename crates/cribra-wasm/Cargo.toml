[package]
name = "cribra-wasm"
version = "0.4.7"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Typed WebAssembly and JavaScript interoperability adapter for Cribra"
repository = "https://github.com/Metalymph/cribra"
homepage = "https://github.com/Metalymph/cribra"
documentation = "https://docs.rs/cribra-wasm"
readme = "README.md"
keywords = ["security", "secrets", "wasm", "privacy", "scanner"]
categories = ["wasm", "development-tools"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["transform"]
transform = ["cribra/transform"]

[dependencies]
cribra = { version = "^0.7", path = "../..", default-features = false }
wasm-bindgen = "0.2"

[[example]]
name = "parity_oracle"
required-features = ["transform"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
