[package]
name = "cribra-wasm"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "WebAssembly and JavaScript interoperability adapter for Cribra"
repository = "https://github.com/Metalymph/cribra"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cribra = { path = "../..", default-features = false, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"