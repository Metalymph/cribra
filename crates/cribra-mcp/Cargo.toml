[package]
name = "cribra-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Minimal Model Context Protocol stdio server foundation for Cribra"
repository = "https://github.com/Metalymph/cribra"
publish = false

[lib]
name = "cribra_mcp"
path = "src/lib.rs"

[[bin]]
name = "cribra-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
jsonschema = { version = "0.61.2", default-features = false }
sha2 = "0.10"
wait-timeout = "0.2"
