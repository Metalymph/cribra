name: Cribra Guard

on:
  push:
    branches: [main]
    paths:
      - "packages/cribra-guard/**"
      - "packages/cribra/**"
      - "crates/cribra-wasm/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/cribra-guard.yml"
  pull_request:
    paths:
      - "packages/cribra-guard/**"
      - "packages/cribra/**"
      - "crates/cribra-wasm/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/cribra-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cribra-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.100.0"
  WASM_BINDGEN_VERSION: "0.2.126"
  BINARYEN_VERSION: "133"
  BINARYEN_SHA256: "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489"
  NODE_VERSION: "24"

jobs:
  mv3-qualification:
    name: Chromium MV3 Flow qualification
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/cribra-guard/package-lock.json

      - name: Install Rust ${{ env.RUST_VERSION }} with WASM target
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.1

      - name: Install wasm-bindgen CLI ${{ env.WASM_BINDGEN_VERSION }}
        run: |
          set -euo pipefail
          cargo install wasm-bindgen-cli \
            --version "$WASM_BINDGEN_VERSION" \
            --locked
          test "$(wasm-bindgen --version | awk '{print $2}')" = "$WASM_BINDGEN_VERSION"

      - name: Install Binaryen ${{ env.BINARYEN_VERSION }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/binaryen.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          sudo install -m 0755 \
            "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt" \
            /usr/local/bin/wasm-opt
          wasm-opt --version | grep -F "version $BINARYEN_VERSION"

      - name: Verify pinned toolchain
        run: |
          set -euo pipefail
          node --version
          rustc --version
          rustc --version | grep -F " $RUST_VERSION "
          wasm-bindgen --version
          wasm-opt --version

      - name: Install extension dependencies
        run: npm ci --prefix packages/cribra-guard

      - name: Install Playwright Chromium
        working-directory: packages/cribra-guard
        run: npx playwright-core install --with-deps chromium

      - name: Build, type-check and qualify
        run: npm run qa --prefix packages/cribra-guard

      - name: Verify release build excludes all qualification artifacts
        run: |
          set -euo pipefail
          npm run build --prefix packages/cribra-guard
          test ! -e packages/cribra-guard/dist/qualification.html
          test ! -e packages/cribra-guard/dist/qualification.js
          test ! -e packages/cribra-guard/dist/content-script.js
          test ! -e packages/cribra-guard/dist/manifest.qualification.json
          test -f packages/cribra-guard/dist/manifest.json
          test -f packages/cribra-guard/dist/service-worker.js
          test -f packages/cribra-guard/dist/wasm/cribra_bg.wasm
          node - <<'NODE'
          const fs = require("node:fs");
          const manifest = JSON.parse(
            fs.readFileSync("packages/cribra-guard/dist/manifest.json", "utf8"),
          );
          if ((manifest.permissions ?? []).length !== 0) {
            throw new Error("production permissions are not empty");
          }
          if ((manifest.host_permissions ?? []).length !== 0) {
            throw new Error("production host permissions are not empty");
          }
          if ((manifest.content_scripts ?? []).length !== 0) {
            throw new Error("production content scripts are not empty");
          }
          if ((manifest.web_accessible_resources ?? []).length !== 0) {
            throw new Error("production web-accessible resources are not empty");
          }
          NODE
          node - <<'NODE'
          const fs = require("node:fs");
          const manifest = JSON.parse(
            fs.readFileSync(
              "packages/cribra-guard/.build/content-dist/manifest.json",
              "utf8",
            ),
          );
          const entries = manifest.content_scripts ?? [];
          if (entries.length !== 1) {
            throw new Error(
              "content qualification must register exactly one content script",
            );
          }
          if (
            JSON.stringify(entries[0].matches) !==
            JSON.stringify(["http://127.0.0.1/*"])
          ) {
            throw new Error(
              "content qualification matches are not localhost-only",
            );
          }
          if (
            JSON.stringify(manifest.host_permissions ?? []) !==
            JSON.stringify(["http://127.0.0.1/*"])
          ) {
            throw new Error(
              "content qualification hosts are not localhost-only",
            );
          }
          if ((manifest.permissions ?? []).length !== 0) {
            throw new Error("content qualification permissions are not empty");
          }
          if (
            !fs.existsSync(
              "packages/cribra-guard/.build/content-dist/content-script.js",
            )
          ) {
            throw new Error("content qualification script is missing");
          }
          if (
            fs.existsSync(
              "packages/cribra-guard/.build/content-dist/qualification.html",
            )
          ) {
            throw new Error(
              "content qualification includes the WASM qualification harness",
            );
          }
          NODE

      - name: Verify the build leaves tracked files untouched
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cribra-guard-webext-1a-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            packages/cribra-guard/.build/qualification/report.json
            packages/cribra-guard/.build/content-qualification/report.json
            packages/cribra-guard/dist/artifact.json
            packages/cribra-guard/.build/content-dist/artifact.json
