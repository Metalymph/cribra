name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CBINDGEN_VERSION: "0.29.4"

jobs:
  linux-gate:
    name: Linux full gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all features
        run: cargo check --all-features

      - name: Test default features
        run: cargo test

      - name: Test serde
        run: cargo test --features serde

      - name: Test all features
        run: cargo test --all-features

      - name: Test rustdoc
        run: cargo test --doc

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  linux-arm64:
    name: Native Linux ARM64 qualification
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.1

      - name: Verify native ARM64 architecture
        run: |
          uname -m
          test "$(uname -m)" = "aarch64"

      - name: Check all features
        run: cargo check -p cribra --all-features

      - name: Test default features
        run: cargo test -p cribra

      - name: Test all features
        run: cargo test -p cribra --all-features

      - name: Test CLI
        run: cargo test -p cribra-cli

      - name: Test C ABI
        run: cargo test -p cribra-capi

      - name: Build native C ABI artifacts
        run: cargo build -p cribra-capi

      - name: Verify Linux native artifacts
        run: |
          test -f target/debug/libcribra_capi.a
          test -f target/debug/libcribra_capi.so

  linux-riscv64:
    name: Linux RISC-V 64 qualification (QEMU)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_RUNNER: qemu-riscv64 -L /usr/riscv64-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-linux-gnu

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.1

      - name: Install GNU cross-toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user binutils-riscv64-linux-gnu

      - name: Verify host, toolchain and runtime
        run: |
          uname -m
          test "$(uname -m)" = "x86_64"
          command -v riscv64-linux-gnu-gcc
          command -v riscv64-linux-gnu-readelf
          command -v qemu-riscv64
          test "$(riscv64-linux-gnu-gcc -dumpmachine)" = "riscv64-linux-gnu"
          riscv64-linux-gnu-gcc --version
          qemu-riscv64 --version
          test -f /usr/riscv64-linux-gnu/lib/ld-linux-riscv64-lp64d.so.1
          rustup target list --installed | grep -Fx riscv64gc-unknown-linux-gnu

      - name: Build target test executables
        run: |
          cargo test -p cribra --target riscv64gc-unknown-linux-gnu --no-run --message-format=json > "$RUNNER_TEMP/riscv64-default.jsonl"
          cargo test -p cribra --target riscv64gc-unknown-linux-gnu --all-features --no-run --message-format=json > "$RUNNER_TEMP/riscv64-all-features.jsonl"

      - name: Verify test executable architecture
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          target_dir = Path("target/riscv64gc-unknown-linux-gnu").resolve()
          for suite in ("default", "all-features"):
              manifest = Path(os.environ["RUNNER_TEMP"]) / f"riscv64-{suite}.jsonl"
              executables = set()
              for line in manifest.read_text().splitlines():
                  artifact = json.loads(line)
                  if (artifact.get("reason") == "compiler-artifact"
                          and artifact.get("profile", {}).get("test")
                          and artifact.get("executable")):
                      executables.add(Path(artifact["executable"]).resolve())
              if not executables:
                  raise RuntimeError(f"No test executables reported for {suite}")
              for executable in sorted(executables):
                  if not executable.is_relative_to(target_dir):
                      raise RuntimeError(f"Unexpected test executable path: {executable}")
                  header = subprocess.check_output(
                      ["riscv64-linux-gnu-readelf", "-h", str(executable)],
                      text=True, env={**os.environ, "LC_ALL": "C"},
                  )
                  print(f"{suite}: {executable}\n{header}")
                  if (not re.search(r"Class:\s+ELF64\s*$", header, re.MULTILINE)
                          or not re.search(r"Machine:\s+RISC-V\s*$", header, re.MULTILINE)):
                      raise RuntimeError(f"Expected RISC-V ELF64: {executable}")
          PY

      - name: Test default features through QEMU
        run: cargo test -p cribra --target riscv64gc-unknown-linux-gnu

      - name: Test all features through QEMU
        run: cargo test -p cribra --target riscv64gc-unknown-linux-gnu --all-features

  cross-platform:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.1

      - name: Check
        run: cargo check --all-features

      - name: Test default features
        run: cargo test

      - name: Test all features
        run: cargo test --all-features

  native-c-abi:
    name: Native C ABI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.1

      - name: Install cbindgen
        shell: bash
        run: cargo install cbindgen --version "$CBINDGEN_VERSION" --locked

      - name: Regenerate C header
        shell: bash
        run: |
          mkdir -p target/c-smoke
          cbindgen \
            --config crates/cribra-capi/cbindgen.toml \
            --crate cribra-capi \
            --output target/c-smoke/cribra.h.generated

      - name: Verify committed header
        shell: bash
        run: diff -u include/cribra.h target/c-smoke/cribra.h.generated

      - name: Build native ABI artifacts
        run: cargo build -p cribra-capi

      - name: Verify Unix native artifacts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -f target/debug/libcribra_capi.a
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            test -f target/debug/libcribra_capi.dylib
          else
            test -f target/debug/libcribra_capi.so
          fi

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify Windows native artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "target\debug\cribra_capi.dll")) {
            throw "cribra_capi.dll was not produced"
          }
          if (-not (Test-Path "target\debug\cribra_capi.dll.lib")) {
            throw "cribra_capi.dll.lib was not produced"
          }
          if (-not (Test-Path "target\debug\cribra_capi.lib")) {
            throw "cribra_capi.lib static library was not produced"
          }

      - name: Verify exported ABI symbols (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: sh crates/cribra-capi/tests/c/check-capi-symbols.sh

      - name: Verify exported ABI symbols (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./crates/cribra-capi/tests/c/check-capi-symbols.ps1

      - name: Install Valgrind
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind

      - name: Compile C consumer (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p target/c-smoke
          cc \
            -std=c11 \
            -Wall \
            -Wextra \
            -Werror \
            -Iinclude \
            crates/cribra-capi/tests/c/smoke.c \
            -Ltarget/debug \
            -lcribra_capi \
            -Wl,-rpath,'$ORIGIN/../debug' \
            -o target/c-smoke/cribra-smoke

      - name: Compile C consumer (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p target/c-smoke
          clang \
            -std=c11 \
            -Wall \
            -Wextra \
            -Werror \
            -Iinclude \
            crates/cribra-capi/tests/c/smoke.c \
            -Ltarget/debug \
            -lcribra_capi \
            -Wl,-rpath,@loader_path/../debug \
            -o target/c-smoke/cribra-smoke

      - name: Compile C consumer (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist target\c-smoke mkdir target\c-smoke
          cl /nologo /std:c11 /W4 /WX /Iinclude crates\cribra-capi\tests\c\smoke.c /link /LIBPATH:target\debug cribra_capi.dll.lib /OUT:target\c-smoke\cribra-smoke.exe

      - name: Run C consumer (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: target/c-smoke/cribra-smoke

      - name: Run C consumer under Valgrind (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          valgrind \
            --leak-check=full \
            --show-leak-kinds=all \
            --errors-for-leak-kinds=definite,indirect \
            --error-exitcode=1 \
            target/c-smoke/cribra-smoke

      - name: Run C consumer (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set PATH=%CD%\target\debug;%PATH%
          target\c-smoke\cribra-smoke.exe
