name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CBINDGEN_VERSION: "0.29.4"

jobs:
  linux-gate:
    name: Linux full gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all features
        run: cargo check --all-features

      - name: Test default features
        run: cargo test

      - name: Test serde
        run: cargo test --features serde

      - name: Test all features
        run: cargo test --all-features

      - name: Test rustdoc
        run: cargo test --doc

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  linux-arm64:
    name: Native Linux ARM64 qualification
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.1

      - name: Verify native ARM64 architecture
        run: |
          uname -m
          test "$(uname -m)" = "aarch64"

      - name: Check all features
        run: cargo check -p cribra --all-features

      - name: Test default features
        run: cargo test -p cribra

      - name: Test all features
        run: cargo test -p cribra --all-features

      - name: Test CLI
        run: cargo test -p cribra-cli

      - name: Test C ABI
        run: cargo test -p cribra-capi

      - name: Build native C ABI artifacts
        run: cargo build -p cribra-capi

      - name: Verify Linux native artifacts
        run: |
          test -f target/debug/libcribra_capi.a
          test -f target/debug/libcribra_capi.so

  linux-riscv64:
    name: Linux RISC-V 64 qualification (QEMU)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_RUNNER: qemu-riscv64 -L /usr/riscv64-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-linux-gnu

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.1

      - name: Install GNU cross-toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user binutils-riscv64-linux-gnu

      - name: Verify host, toolchain and runtime
        run: |
          uname -m
          test "$(uname -m)" = "x86_64"
          command -v riscv64-linux-gnu-gcc
          command -v riscv64-linux-gnu-readelf
          command -v qemu-riscv64
          test "$(riscv64-linux-gnu-gcc -dumpmachine)" = "riscv64-linux-gnu"
          riscv64-linux-gnu-gcc --version
          qemu-riscv64 --version
          test -f /usr/riscv64-linux-gnu/lib/ld-linux-riscv64-lp64d.so.1
          rustup target list --installed | grep -Fx riscv64gc-unknown-linux-gnu

      - name: Build target test executables
        run: |
          cargo test -p cribra --target riscv64gc-unknown-linux-gnu --no-run --message-format=json > "$RUNNER_TEMP/riscv64-default.jsonl"
          cargo test -p cribra --target riscv64gc-unknown-linux-gnu --all-features --no-run --message-format=json > "$RUNNER_TEMP/riscv64-all-features.jsonl"

      - name: Verify test executable architecture
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          target_dir = Path("target/riscv64gc-unknown-linux-gnu").resolve()
          for suite in ("default", "all-features"):
              manifest = Path(os.environ["RUNNER_TEMP"]) / f"riscv64-{suite}.jsonl"
              executables = set()
              for line in manifest.read_text().splitlines():
                  artifact = json.loads(line)
                  if (artifact.get("reason") == "compiler-artifact"
                          and artifact.get("profile", {}).get("test")
                          and artifact.get("executable")):
                      executables.add(Path(artifact["executable"]).resolve())
              if not executables:
                  raise RuntimeError(f"No test executables reported for {suite}")
              for executable in sorted(executables):
                  if not executable.is_relative_to(target_dir):
                      raise RuntimeError(f"Unexpected test executable path: {executable}")
                  header = subprocess.check_output(
                      ["riscv64-linux-gnu-readelf", "-h", str(executable)],
                      text=True, env={**os.environ, "LC_ALL": "C"},
                  )
                  print(f"{suite}: {executable}\n{header}")
                  if (not re.search(r"Class:\s+ELF64\s*$", header, re.MULTILINE)
                          or not re.search(r"Machine:\s+RISC-V\s*$", header, re.MULTILINE)):
                      raise RuntimeError(f"Expected RISC-V ELF64: {executable}")
          PY

      - name: Run selected runtime smoke tests through QEMU
        shell: bash
        env:
          RAYON_NUM_THREADS: "2"
        run: |
          set -euo pipefail

          run_smoke() {
            local test_target="$1"
            local test_name="$2"
            shift 2
            local log="$RUNNER_TEMP/riscv64-smoke-$test_target"

            cargo test -p cribra --target riscv64gc-unknown-linux-gnu \
              --test "$test_target" "$@" "$test_name" -- --exact --list | tee "$log.list"
            grep -Fx "$test_name: test" "$log.list"

            cargo test -p cribra --target riscv64gc-unknown-linux-gnu \
              --test "$test_target" "$@" "$test_name" -- --exact | tee "$log.run"
            grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$log.run"
          }

          # Custom rule compilation, detection and report generation.
          run_smoke custom_rules custom_literal_promotes_domain_knowledge_to_a_finding
          run_smoke streaming public_session_is_send_and_returns_the_existing_report
          run_smoke incremental public_document_ownership_and_revisioned_utf8_edits
          run_smoke transform_redact public_redaction_uses_scanner_spans
          run_smoke transform_pseudonymization same_secret_across_sources_has_same_pseudonym
          run_smoke parallel serial_and_parallel_summaries_are_identical --all-features

  python-linux-wheel:
    name: Python Linux wheel qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      WHEEL_PLATFORM_DIR: target/uniffi-python-wheel/fuse/linux_x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.1

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pinned Python build requirements
        run: python -m pip install --disable-pip-version-check -r bindings/python/build-requirements.txt

      - name: Build the Fuse wheel
        run: |
          python bindings/python/build_wheel.py
          WHEEL="$(python -c "import json; print(json.load(open('$WHEEL_PLATFORM_DIR/build-info.json'))['wheel'])")"
          echo "WHEEL=$WHEEL" >> "$GITHUB_ENV"

      - name: Verify the ELF shared library
        run: |
          LIBRARY="$(python -c "import json; print(json.load(open('$WHEEL_PLATFORM_DIR/build-info.json'))['nativeLibrary'])")"
          test -f "$LIBRARY"
          file "$LIBRARY"
          readelf -h "$LIBRARY"
          readelf -d "$LIBRARY"
          ldd "$LIBRARY"

      - name: Qualify the installed wheel
        run: python bindings/python/wheel_smoke.py "$WHEEL" --python "$(command -v python3)"

  python-manylinux-wheel:
    name: Python manylinux_2_28 x86_64 qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MANYLINUX_DIR: target/uniffi-python-wheel/fuse/manylinux_2_28_x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reuses the 3.1 + 3.2 tooling: build_manylinux_wheel.sh runs the
      # digest-pinned official PyPA manylinux_2_28_x86_64 image and fails closed
      # unless auditwheel show *and* repair both succeed. Nothing is published.
      - name: Build and auditwheel-repair the manylinux wheel
        run: sh bindings/python/build_manylinux_wheel.sh

      - name: Verify the auditwheel evidence and the repaired wheel
        run: |
          set -euo pipefail
          test -f "$MANYLINUX_DIR/auditwheel-show.txt"
          test -f "$MANYLINUX_DIR/build-info.json"
          wheel="$(find "$MANYLINUX_DIR/dist" -maxdepth 1 -name 'cribra-*-py3-none-manylinux_2_28_x86_64.whl')"
          test -n "$wheel"
          test "$(printf '%s\n' "$wheel" | wc -l)" -eq 1
          echo "WHEEL=$wheel" >> "$GITHUB_ENV"
          cat "$MANYLINUX_DIR/auditwheel-show.txt"
          grep -q 'consistent with' "$MANYLINUX_DIR/auditwheel-show.txt"
          grep -q 'manylinux_2_28_x86_64' "$MANYLINUX_DIR/auditwheel-show.txt"

      # Reuses the 3.2 tooling: qualify_manylinux_wheel.sh runs the repaired
      # wheel through wheel_smoke.py's isolated, offline, no-Rust consumer venvs.
      - name: Qualify the repaired wheel on CPython 3.11-3.14
        run: |
          set -euo pipefail
          sh bindings/python/qualify_manylinux_wheel.sh "$WHEEL" 2>&1 | tee manylinux-consumer.log

      - name: Require all four CPython versions and 28/28 consumer tests
        run: |
          set -euo pipefail
          for minor in 11 12 13 14; do
            grep -qE "^  PASS: /opt/python/cp3${minor}-cp3${minor}/bin/python - Python 3\.${minor}\." manylinux-consumer.log
          done
          test "$(grep -c '^  PASS: /opt/python/cp3' manylinux-consumer.log)" -eq 4
          test "$(grep -cE '\.\.\. ok$' manylinux-consumer.log)" -eq 28
          test "$(grep -c '^Ran 7 tests in' manylinux-consumer.log)" -eq 4
          if grep -q 'FAIL' manylinux-consumer.log; then
            echo "an installed-consumer interpreter failed" >&2
            exit 1
          fi
          grep -qF 'PASS: wheel metadata/RECORD, native library, offline installs and installed consumer:' manylinux-consumer.log
          grep -qF 'py3-none-manylinux_2_28_x86_64.whl' manylinux-consumer.log

      - name: Upload the repaired wheel and auditwheel evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cribra-fuse-manylinux_2_28_x86_64
          path: |
            target/uniffi-python-wheel/fuse/manylinux_2_28_x86_64/dist/*.whl
            target/uniffi-python-wheel/fuse/manylinux_2_28_x86_64/auditwheel-show.txt
            target/uniffi-python-wheel/fuse/manylinux_2_28_x86_64/build-info.json
            manylinux-consumer.log
          if-no-files-found: warn

  python-windows-wheel:
    name: Python Windows x86_64 qualification
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      WHEEL_PLATFORM_DIR: target/uniffi-python-wheel/fuse/windows_x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify native x86_64 architecture
        shell: pwsh
        run: |
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") {
            throw "windows-2022 must run on native x86_64 (AMD64), found $env:PROCESSOR_ARCHITECTURE"
          }

      # Exactly the toolchain the builder pins (`cargo +1.97.0`) plus the native
      # MSVC x86_64 target of windows-2022. Nothing else is installed.
      - name: Install Rust 1.97.0 with the MSVC x86_64 target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          targets: x86_64-pc-windows-msvc

      - name: Configure MSVC build tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.1

      - name: Set up Python 3.11
        id: python311
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Python 3.12
        id: python312
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Python 3.14
        id: python314
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # 3.13 is set up last so a bare `python` also resolves to the build interpreter.
      - name: Set up Python 3.13
        id: python313
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pinned Python build requirements with Python 3.13
        shell: pwsh
        run: |
          $python = '${{ steps.python313.outputs.python-path }}'
          & $python --version
          & $python -m pip install --disable-pip-version-check -r bindings/python/build-requirements.txt

      - name: Build the Windows Fuse wheel with Python 3.13
        shell: pwsh
        run: |
          $python = '${{ steps.python313.outputs.python-path }}'
          & $python bindings/python/build_wheel.py
          $wheel = (Get-Content "$env:WHEEL_PLATFORM_DIR\build-info.json" | ConvertFrom-Json).wheel
          "WHEEL=$wheel" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "WHEEL=$wheel"

      # Reuses the builder's own logic - build_wheel.pe_amd64_dll_error (PE32+ /
      # IMAGE_FILE_MACHINE_AMD64 / IMAGE_FILE_DLL) and
      # build_wheel.packaged_native_libraries (exactly one native library, never a
      # foreign platform). No PE parser or native-library rule is re-implemented.
      - name: Verify the wheel (PE32+ AMD64 DLL, win_amd64 tag, non-pure)
        shell: pwsh
        run: |
          $python = '${{ steps.python313.outputs.python-path }}'
          $verifier = Join-Path $env:RUNNER_TEMP "verify-windows-wheel.py"
          @'
          import json
          from email.parser import BytesParser
          from pathlib import Path
          import sys
          import zipfile

          sys.path.insert(0, "bindings/python")
          import build_wheel

          info = json.loads((Path(sys.argv[1]) / "build-info.json").read_text())
          wheel = Path(info["wheel"])
          native = Path(info["nativeLibrary"])
          assert wheel.is_file() and native.is_file(), (wheel, native)
          assert wheel.name.endswith("py3-none-win_amd64.whl"), wheel.name
          error = build_wheel.pe_amd64_dll_error(native.read_bytes())
          assert error is None, error
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              packaged = build_wheel.packaged_native_libraries(archive)
              assert packaged == ["cribra_uniffi/cribra_uniffi.dll"], packaged
              foreign = [name for name in names
                         if name.endswith(("libcribra_uniffi.so", "libcribra_uniffi.dylib"))]
              assert not foreign, foreign
              metadata_name = next(name for name in names if name.endswith(".dist-info/WHEEL"))
              fields = BytesParser().parsebytes(archive.read(metadata_name))
              assert fields["Tag"] == "py3-none-win_amd64", fields["Tag"]
              assert fields["Root-Is-Purelib"] == "false", fields["Root-Is-Purelib"]
          print(f"Verified {wheel.name}: exactly one cribra_uniffi/cribra_uniffi.dll "
                f"(PE32+ AMD64 DLL), tag py3-none-win_amd64, non-pure, no foreign native libraries.")
          '@ | Set-Content -Path $verifier -Encoding utf8
          & $python $verifier "$env:WHEEL_PLATFORM_DIR"

      # Reuses the existing smoke runner and the real wheel, with explicit paths
      # so each CPython 3.11-3.14 is installed and qualified independently.
      - name: Qualify the installed wheel on Python 3.11, 3.12, 3.13 and 3.14
        shell: pwsh
        run: |
          $python = '${{ steps.python313.outputs.python-path }}'
          $interpreters = @(
            '${{ steps.python311.outputs.python-path }}',
            '${{ steps.python312.outputs.python-path }}',
            '${{ steps.python313.outputs.python-path }}',
            '${{ steps.python314.outputs.python-path }}'
          )
          $wheel = (Get-Content "$env:WHEEL_PLATFORM_DIR\build-info.json" | ConvertFrom-Json).wheel
          $arguments = @("bindings/python/wheel_smoke.py", $wheel)
          foreach ($interpreter in $interpreters) {
            $arguments += @("--python", $interpreter)
          }
          & $python @arguments 2>&1 | Tee-Object -FilePath windows-consumer.log
          if ($LASTEXITCODE -ne 0) {
            throw "wheel_smoke.py exited with $LASTEXITCODE"
          }

      - name: Require all four CPython versions and 28/28 consumer tests
        shell: pwsh
        run: |
          $lines = Get-Content windows-consumer.log
          foreach ($minor in 11, 12, 13, 14) {
            if (-not ($lines | Select-String -Pattern "^  PASS: .* - Python 3\.$minor\.")) {
              throw "Python 3.$minor did not pass the installed-consumer qualification"
            }
          }
          $passes = ($lines | Select-String -Pattern "^  PASS: ").Count
          $tests = ($lines | Select-String -Pattern "\.\.\. ok$").Count
          $runs = ($lines | Select-String -Pattern "^Ran 7 tests in").Count
          if ($passes -ne 4) { throw "expected 4 passing interpreters, found $passes" }
          if ($tests -ne 28) { throw "expected 28 passing consumer tests, found $tests" }
          if ($runs -ne 4) { throw "expected 4 consumer runs, found $runs" }
          if ($lines | Select-String -Pattern "FAIL") { throw "an installed-consumer interpreter failed" }
          if (-not ($lines | Select-String -SimpleMatch "PASS: wheel metadata/RECORD, native library, offline installs and installed consumer:")) {
            throw "missing the final qualification PASS line"
          }
          if (-not ($lines | Select-String -Pattern "py3-none-win_amd64\.whl")) {
            throw "qualification evidence does not mention the win_amd64 wheel"
          }
          Write-Host "All four CPython versions passed all 28 installed-consumer tests."

      - name: Upload the Windows wheel and qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cribra-fuse-windows_x86_64
          path: |
            target/uniffi-python-wheel/fuse/windows_x86_64/dist/*.whl
            target/uniffi-python-wheel/fuse/windows_x86_64/build-info.json
            windows-consumer.log
          if-no-files-found: warn

  cross-platform:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.1

      - name: Check
        run: cargo check --all-features

      - name: Test default features
        run: cargo test

      - name: Test all features
        run: cargo test --all-features

  native-c-abi:
    name: Native C ABI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.1

      - name: Install cbindgen
        shell: bash
        run: cargo install cbindgen --version "$CBINDGEN_VERSION" --locked

      - name: Regenerate C header
        shell: bash
        run: |
          mkdir -p target/c-smoke
          cbindgen \
            --config crates/cribra-capi/cbindgen.toml \
            --crate cribra-capi \
            --output target/c-smoke/cribra.h.generated

      - name: Verify committed header
        shell: bash
        run: diff -u include/cribra.h target/c-smoke/cribra.h.generated

      - name: Build native ABI artifacts
        run: cargo build -p cribra-capi

      - name: Verify Unix native artifacts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -f target/debug/libcribra_capi.a
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            test -f target/debug/libcribra_capi.dylib
          else
            test -f target/debug/libcribra_capi.so
          fi

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify Windows native artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "target\debug\cribra_capi.dll")) {
            throw "cribra_capi.dll was not produced"
          }
          if (-not (Test-Path "target\debug\cribra_capi.dll.lib")) {
            throw "cribra_capi.dll.lib was not produced"
          }
          if (-not (Test-Path "target\debug\cribra_capi.lib")) {
            throw "cribra_capi.lib static library was not produced"
          }

      - name: Verify exported ABI symbols (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: sh crates/cribra-capi/tests/c/check-capi-symbols.sh

      - name: Verify exported ABI symbols (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./crates/cribra-capi/tests/c/check-capi-symbols.ps1

      - name: Install Valgrind
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind

      - name: Compile C consumer (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p target/c-smoke
          cc \
            -std=c11 \
            -Wall \
            -Wextra \
            -Werror \
            -Iinclude \
            crates/cribra-capi/tests/c/smoke.c \
            -Ltarget/debug \
            -lcribra_capi \
            -Wl,-rpath,'$ORIGIN/../debug' \
            -o target/c-smoke/cribra-smoke

      - name: Compile C consumer (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p target/c-smoke
          clang \
            -std=c11 \
            -Wall \
            -Wextra \
            -Werror \
            -Iinclude \
            crates/cribra-capi/tests/c/smoke.c \
            -Ltarget/debug \
            -lcribra_capi \
            -Wl,-rpath,@loader_path/../debug \
            -o target/c-smoke/cribra-smoke

      - name: Compile C consumer (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist target\c-smoke mkdir target\c-smoke
          cl /nologo /std:c11 /W4 /WX /Iinclude crates\cribra-capi\tests\c\smoke.c /link /LIBPATH:target\debug cribra_capi.dll.lib /OUT:target\c-smoke\cribra-smoke.exe

      - name: Run C consumer (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: target/c-smoke/cribra-smoke

      - name: Run C consumer under Valgrind (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          valgrind \
            --leak-check=full \
            --show-leak-kinds=all \
            --errors-for-leak-kinds=definite,indirect \
            --error-exitcode=1 \
            target/c-smoke/cribra-smoke

      - name: Run C consumer (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set PATH=%CD%\target\debug;%PATH%
          target\c-smoke\cribra-smoke.exe
